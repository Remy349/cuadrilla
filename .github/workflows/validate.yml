name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual run on main: re-runs the checks and retries a release that didn't finish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate.py

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck installer, tests and release script
        run: shellcheck install.sh scripts/test-install.sh scripts/release.sh
      - name: End-to-end install test
        run: scripts/test-install.sh

  install-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (what most Windows users have), pwsh = PowerShell 7
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        if: matrix.shell == 'pwsh'
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host: the installer talks to an interactive console. Invoke-Expression: the test
          # replays the `irm | iex` path on purpose.
          $issues = foreach ($file in "install.ps1", "scripts/test-install.ps1") {
            Invoke-ScriptAnalyzer -Path $file -Severity Warning, Error `
              -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingInvokeExpression
          }
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: install.ps1 is ASCII-only (Windows PowerShell 5.1 reads BOM-less files as ANSI)
        run: |
          if ((Get-Content install.ps1 -Raw) -match '[^\x00-\x7F]') { throw "install.ps1 contains non-ASCII characters" }
      - name: End-to-end install test
        run: ./scripts/test-install.ps1

  # Tags the version at the top of CHANGELOG.md and publishes its GitHub Release --
  # only from main, and only after every check passed. Older commits can't be tagged
  # from here: GITHUB_TOKEN may not create refs to commits whose workflow files differ
  # (that needs the `workflows` permission), so backfills are done by a maintainer.
  release:
    needs: [lint-agents, install-linux, install-windows]
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and older commits
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
